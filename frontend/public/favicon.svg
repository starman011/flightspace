<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="96" height="96">
  <rect width="64" height="64" rx="14" fill="#050a0f"/>
  <!-- orbit ring (tilted) -->
  <ellipse cx="32" cy="32" rx="25" ry="11" fill="none" stroke="#b2ff1a" stroke-width="2.5" opacity="0.5" transform="rotate(-28 32 32)"/>
  <!-- globe -->
  <circle cx="32" cy="32" r="12.5" fill="none" stroke="#b2ff1a" stroke-width="3.2"/>
  <!-- meridian to read as a globe -->
  <ellipse cx="32" cy="32" rx="5" ry="12.5" fill="none" stroke="#b2ff1a" stroke-width="2.2" opacity="0.65"/>
  <!-- tracked object on the orbit -->
  <circle cx="50.5" cy="18.5" r="5.5" fill="#b2ff1a"/>
</svg>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Apply saved theme before first paint (no flash). Dark is the default. -->
    <script>
      try { if (localStorage.getItem('ot-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
    </script>

    <!-- ── Primary SEO ──────────────────────────────────────────────── -->
    <title>ObjectTracer — Live Flight &amp; Space Tracker on a Real-Time 3D Globe</title>
    <meta name="description"
          content="Track live flights in real time on a free, interactive 3D globe — every aircraft's position, altitude, speed and route from open ADS-B data. Plus ships, the ISS live stream, satellites and rocket launches." />
    <meta name="keywords"
          content="flight tracker, live flight radar, real-time aircraft tracking, ADS-B, ship tracker, AIS maritime, satellite tracker, ISS tracker, ISS live stream, space station, 3D globe, flight map, rocket launch tracker, asteroid tracker, near-earth objects, deep space, DESI galaxies, solar system, moon tracker, plane tracker, live plane map, flight status, aircraft tracking" />
    <meta name="author" content="ObjectTracer" />
    <!-- Static canonical fallback for Googlebot (JS updates this per route after hydration) -->
    <link rel="canonical" href="https://www.objecttracer.com/" />
    <link rel="alternate" type="application/rss+xml" title="ObjectTracer Blog" href="https://www.objecttracer.com/feed.xml" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp) ────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.objecttracer.com/" />
    <meta property="og:title"       content="ObjectTracer — Live Flight &amp; Space Tracker on a 3D Globe" />
    <meta property="og:description" content="Track live flights in real time on a free 3D globe — position, altitude, speed and route from ADS-B. Plus ships, ISS, satellites and launches." />
    <meta property="og:image"       content="https://www.objecttracer.com/api/og?title=Live%20Flight%20Tracker%20%26%20Radar&subtitle=Track%20live%20flights%2C%20plus%20ships%2C%20ISS%2C%20satellites%20%26%20launches%20on%20a%203D%20globe&badge=REAL-TIME%203D%20GLOBE" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:site_name"   content="ObjectTracer" />

    <!-- ── Twitter / X Card ─────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:url"         content="https://www.objecttracer.com/" />
    <meta name="twitter:title"       content="ObjectTracer — Live Flight &amp; Space Tracker" />
    <meta name="twitter:description" content="Track live flights in real time on a free 3D globe — ADS-B position, altitude, speed and route. Plus ships, ISS, satellites and launches." />
    <meta name="twitter:image"       content="https://www.objecttracer.com/api/og?title=Live%20Flight%20Tracker%20%26%20Radar&subtitle=Track%20live%20flights%2C%20plus%20ships%2C%20ISS%2C%20satellites%20%26%20launches%20on%20a%203D%20globe&badge=REAL-TIME%203D%20GLOBE" />

    <!-- ── Structured Data (JSON-LD) ────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ObjectTracer",
      "alternateName": "ObjectTracer Live Flight Tracker",
      "url": "https://www.objecttracer.com/",
      "description": "Live flight tracker on a real-time 3D globe: track aircraft worldwide from open ADS-B data with position, altitude, speed and route. Also tracks ships (AIS), the ISS live stream, satellites, rocket launches, asteroids, and deep-space galaxies.",
      "applicationCategory": "UtilityApplication",
      "applicationSubCategory": "Flight Tracker",
      "operatingSystem": "All",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": [
        "Live ADS-B flight tracking with aircraft photos and route maps",
        "Real-time AIS ship tracking",
        "ISS live tracking with NASA video stream and crew manifest",
        "Satellite and orbital object tracking",
        "Rocket launch countdown tracker",
        "Near-Earth asteroid tracker (NASA NeoWs)",
        "DESI deep-space galaxy catalog with 3D cosmic web",
        "Solar system and lunar orbiter visualization",
        "Interactive 3D globe with multi-scale zoom (Earth to galaxy)",
        "Search by callsign, ICAO24, or flight number"
      ],
      "screenshot": "https://www.objecttracer.com/api/og?title=Live%20Flight%20Tracker%20%26%20Radar&subtitle=Track%20live%20flights%2C%20plus%20ships%2C%20ISS%2C%20satellites%20%26%20launches%20on%20a%203D%20globe&badge=REAL-TIME%203D%20GLOBE"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ObjectTracer",
      "url": "https://www.objecttracer.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.objecttracer.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ObjectTracer",
      "url": "https://www.objecttracer.com/",
      "logo": "https://www.objecttracer.com/favicon-512.png",
      "description": "Real-time 3D globe tracking live flights, ships, the ISS, satellites, rocket launches, asteroids, and deep-space galaxies.",
      "foundingDate": "2026",
      "sameAs": ["https://github.com/starman011", "https://github.com/starman011/flightspace"]
    }
    </script>

    <!-- ── Favicon & PWA ─────────────────────────────────────────────── -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to all external origins used by the app -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />

    <!-- Design system fonts: Space Grotesk (headlines), IBM Plex Mono (telemetry), Inter (body) -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" />

    <!-- Material Symbols for UI icons -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Kick off world-atlas fetch early so it's ready when Globe initialises -->
    <link rel="prefetch" as="fetch" crossorigin
          href="https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
